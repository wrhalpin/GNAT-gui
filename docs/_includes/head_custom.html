<!-- Favicons -->
<link rel="icon" type="image/svg+xml"
      href="{{ '/assets/logo/favicon.svg' | relative_url }}">
<link rel="shortcut icon"
      href="{{ '/assets/logo/favicon.svg' | relative_url }}">

<!-- Open Graph -->
<meta property="og:site_name"   content="GNAT-gui">
<meta property="og:title"       content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image"       content="{{ '/assets/logo/social-card.svg' | absolute_url }}">
<meta property="og:type"        content="website">

<!-- Twitter / X card -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image"       content="{{ '/assets/logo/social-card.svg' | absolute_url }}">

<!-- Custom stylesheet (slate blue palette) -->
<link rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}">
