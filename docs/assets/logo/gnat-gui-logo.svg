<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background: dark rounded square -->
  <rect x="4" y="4" width="248" height="248" rx="44" fill="#1e3355"/>

  <!-- Window chrome bar -->
  <rect x="28" y="40" width="200" height="26" rx="7" fill="#3b6ea8"/>

  <!-- Window control dots -->
  <circle cx="48" cy="53" r="5.5" fill="#e05252" opacity=".85"/>
  <circle cx="65" cy="53" r="5.5" fill="#d4a017" opacity=".85"/>
  <circle cx="82" cy="53" r="5.5" fill="#3a9a5c" opacity=".85"/>

  <!-- Sidebar panel -->
  <rect x="28" y="78" width="62" height="138" rx="7" fill="#2d4f7c"/>

  <!-- Sidebar nav items -->
  <rect x="38" y="92"  width="42" height="7" rx="3.5" fill="#a8c4e0"/>
  <rect x="38" y="110" width="42" height="7" rx="3.5" fill="#5b8db8" opacity=".75"/>
  <rect x="38" y="128" width="42" height="7" rx="3.5" fill="#5b8db8" opacity=".55"/>
  <rect x="38" y="146" width="42" height="7" rx="3.5" fill="#5b8db8" opacity=".4"/>
  <rect x="38" y="164" width="42" height="7" rx="3.5" fill="#5b8db8" opacity=".3"/>

  <!-- Content panel -->
  <rect x="103" y="78" width="125" height="138" rx="7" fill="#2d4f7c" opacity=".55"/>

  <!-- Graph: edges (drawn first so nodes sit on top) -->
  <line x1="147" y1="124" x2="178" y2="108" stroke="#a8c4e0" stroke-width="2.2" opacity=".75"/>
  <line x1="147" y1="128" x2="194" y2="158" stroke="#a8c4e0" stroke-width="2.2" opacity=".65"/>
  <line x1="185" y1="164" x2="165" y2="174" stroke="#a8c4e0" stroke-width="2.2" opacity=".6"/>
  <line x1="178" y1="100" x2="204" y2="128" stroke="#a8c4e0" stroke-width="2.2" opacity=".5"/>

  <!-- Graph: nodes -->
  <circle cx="143" cy="126" r="13" fill="#3b6ea8"/>
  <circle cx="183" cy="103" r="10" fill="#5b8db8"/>
  <circle cx="208" cy="134" r="8"  fill="#4a7cbf"/>
  <circle cx="198" cy="164" r="9"  fill="#3b6ea8" opacity=".85"/>
  <circle cx="162" cy="177" r="7"  fill="#5b8db8" opacity=".7"/>
</svg>
