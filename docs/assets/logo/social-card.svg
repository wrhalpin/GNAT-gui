<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e3355"/>
      <stop offset="55%"  stop-color="#2d4f7c"/>
      <stop offset="100%" stop-color="#3b6ea8"/>
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#3b6ea8" stroke-width=".6" opacity=".25"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#5b8db8"/>

  <!-- Logo icon (simplified, right side) -->
  <g transform="translate(820, 115)">
    <rect x="0" y="0" width="290" height="290" rx="52" fill="#1a2c48" opacity=".85"/>
    <rect x="22" y="36" width="246" height="30"  rx="8"  fill="#3b6ea8"/>
    <circle cx="44"  cy="51" r="7" fill="#e05252" opacity=".8"/>
    <circle cx="63"  cy="51" r="7" fill="#d4a017" opacity=".8"/>
    <circle cx="82"  cy="51" r="7" fill="#3a9a5c" opacity=".8"/>
    <rect x="22" y="78" width="76"  height="168" rx="8"  fill="#2d4f7c"/>
    <rect x="108" y="78" width="160" height="168" rx="8"  fill="#2d4f7c" opacity=".5"/>
    <rect x="32" y="94"  width="56" height="9" rx="4.5" fill="#a8c4e0"/>
    <rect x="32" y="114" width="56" height="9" rx="4.5" fill="#5b8db8" opacity=".7"/>
    <rect x="32" y="134" width="56" height="9" rx="4.5" fill="#5b8db8" opacity=".5"/>
    <rect x="32" y="154" width="56" height="9" rx="4.5" fill="#5b8db8" opacity=".35"/>
    <!-- Graph nodes -->
    <circle cx="168" cy="152" r="17" fill="#3b6ea8"/>
    <circle cx="218" cy="128" r="13" fill="#5b8db8"/>
    <circle cx="244" cy="178" r="11" fill="#4a7cbf"/>
    <circle cx="208" cy="214" r="10" fill="#3b6ea8" opacity=".8"/>
    <line x1="184" y1="145" x2="207" y2="133" stroke="#a8c4e0" stroke-width="2.5" opacity=".7"/>
    <line x1="183" y1="158" x2="234" y2="172" stroke="#a8c4e0" stroke-width="2.5" opacity=".6"/>
    <line x1="238" y1="188" x2="217" y2="206" stroke="#a8c4e0" stroke-width="2.5" opacity=".55"/>
  </g>

  <!-- Main heading -->
  <text x="90" y="200" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700"
        font-size="96" fill="#ffffff" letter-spacing="-2">GNAT-gui</text>

  <!-- Tagline -->
  <text x="92" y="268" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400"
        font-size="32" fill="#a8c4e0">Analyst workbench for the GNAT threat intelligence platform</text>

  <!-- Divider -->
  <rect x="90" y="300" width="620" height="3" rx="1.5" fill="#3b6ea8" opacity=".7"/>

  <!-- Tech stack badges -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600">
    <!-- Frontend row -->
    <rect x="90"  y="324" width="140" height="36" rx="18" fill="#2d4f7c"/>
    <text x="160" y="348" fill="#a8c4e0" text-anchor="middle">React 18</text>

    <rect x="244" y="324" width="136" height="36" rx="18" fill="#2d4f7c"/>
    <text x="312" y="348" fill="#a8c4e0" text-anchor="middle">TypeScript</text>

    <rect x="394" y="324" width="118" height="36" rx="18" fill="#2d4f7c"/>
    <text x="453" y="348" fill="#a8c4e0" text-anchor="middle">React Flow</text>

    <rect x="526" y="324" width="114" height="36" rx="18" fill="#2d4f7c"/>
    <text x="583" y="348" fill="#a8c4e0" text-anchor="middle">Monaco</text>

    <!-- Backend row -->
    <rect x="90"  y="376" width="134" height="36" rx="18" fill="#1a2c48"/>
    <text x="157" y="400" fill="#7cb8e0" text-anchor="middle">FastAPI</text>

    <rect x="238" y="376" width="162" height="36" rx="18" fill="#1a2c48"/>
    <text x="319" y="400" fill="#7cb8e0" text-anchor="middle">SQLAlchemy 2</text>

    <rect x="414" y="376" width="130" height="36" rx="18" fill="#1a2c48"/>
    <text x="479" y="400" fill="#7cb8e0" text-anchor="middle">Pydantic v2</text>

    <rect x="558" y="376" width="124" height="36" rx="18" fill="#1a2c48"/>
    <text x="620" y="400" fill="#7cb8e0" text-anchor="middle">SSE + RBAC</text>
  </g>

  <!-- Module labels -->
  <text x="90"  y="470" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600"
        font-size="26" fill="#ffffff">Analysis</text>
  <text x="90"  y="502" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400"
        font-size="22" fill="#7099c4">Investigations · Hypotheses · Gap detection · Reports</text>

  <text x="90"  y="544" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600"
        font-size="26" fill="#ffffff">Rules Builder · Investigations Graph</text>
  <text x="90"  y="576" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400"
        font-size="22" fill="#7099c4">Hy · YAML DSL · Prolog · 5-step evidence pipeline · STIX 2.1</text>

  <!-- URL / footer -->
  <text x="90" y="615" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400"
        font-size="20" fill="#4a6f9e">github.com/wrhalpin/GNAT-gui</text>
</svg>
