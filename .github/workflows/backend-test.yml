name: backend-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gnat_gui
          POSTGRES_PASSWORD: gnat_gui
          POSTGRES_DB: gnat_gui_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]" && pip install -e "../GNAT" || true
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Ruff format
        working-directory: backend
        run: ruff format --check .
      - name: mypy
        working-directory: backend
        run: mypy gnat_gui
      - name: pytest
        working-directory: backend
        env:
          GNAT_GUI_DB_URL: postgresql+psycopg2://gnat_gui:gnat_gui@localhost/gnat_gui_test
        run: pytest --cov=gnat_gui --cov-report=term-missing
