name: backend-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # gnat core is not on PyPI; the backend imports it lazily and the test suite
      # stubs it (tests/conftest.py), so the suite runs without the real library.
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Ruff format
        working-directory: backend
        run: ruff format --check .
      - name: mypy
        working-directory: backend
        run: mypy gnat_gui
      - name: pytest
        working-directory: backend
        run: pytest --cov=gnat_gui --cov-report=term-missing
