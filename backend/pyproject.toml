[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnat-gui-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "starlette-csrf>=3.0",
    "slowapi>=0.1.9",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "gnat",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["gnat_gui"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
fail_under = 75
