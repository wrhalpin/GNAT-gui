[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Project is named gnat-gui-backend but the import package is gnat_gui; tell hatchling
# explicitly, otherwise `pip install -e .` fails to determine wheel contents.
packages = ["gnat_gui"]

[project]
name = "gnat-gui-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "starlette-csrf>=3.0",
    "slowapi>=0.1.9",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",
    # NOTE: `gnat` (the core library) is not published to PyPI. Install it editable
    # alongside this repo: `pip install -e ../GNAT`. The GUI imports it lazily so the
    # backend still starts (with job handlers registered as no-ops) when it is absent.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# B008: FastAPI intentionally calls Depends()/Query() in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and inline demo credentials by design.
"tests/**" = ["S101", "S105", "S106", "S107"]
# Alembic migrations are autogenerated.
"alembic/**" = ["E501", "I001"]

[tool.mypy]
python_version = "3.11"
# Pragmatic checking: catch real type errors without the full strict suite, which
# would flag every FastAPI `dict` body and Any-typed GNAT boundary.
strict = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["gnat_gui"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
fail_under = 75
